<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배경 배너 효과</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-wrap {
      position: relative;
      width: 100%;
      max-width: 800px;
    }

    /* 왼쪽(213,237,195) → 오른쪽(163,209,246) 그라데이션 */
    .banner {
      position: relative;
      width: 100%;
      min-height: 180px;
      background: linear-gradient(
        to right,
        rgb(213, 237, 195),
        rgb(163, 209, 246)
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-content {
      position: relative;
      z-index: 1;
      color: white;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* 하단 웨이브: 배너 아래로 살짝 내려가며 흰 배경과 겹치는 효과 */
    .wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      pointer-events: none;
      transform: translateY(99%);
      line-height: 0;
    }

    .wave svg {
      width: 100%;
      height: 100%;
      display: block;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="banner-wrap">
    <div class="banner">
      <div class="banner-content">Mun Jiwon ✨⭐</div>
    </div>
    <!-- 반투명 웨이브가 흰 배경과 자연스럽게 겹침 -->
    <div class="wave">
      <svg viewBox="0 0 1200 56" preserveAspectRatio="none">
        <path
          d="M0,28 Q300,0 600,28 T1200,28 L1200,56 L0,56 Z"
          fill="rgba(163, 209, 246, 0.4)"
        />
        <path
          d="M0,38 Q400,8 800,38 T1200,38 L1200,56 L0,56 Z"
          fill="rgba(255,255,255,0.55)"
        />
      </svg>
    </div>
  </div>
</body>
</html>
